# CloudStream for Linux player profile. Managed by the app: it is rewritten on update.
# Put personal options in Settings > Playback > Extra mpv options instead.

# uosc draws the interface; mpv's own OSC/OSD bar stay off.
osc=no
osd-bar=no
border=no
# Stay alive after a file ends or fails: the app decides whether to try another
# source, play the next episode or close.
idle=yes
keep-open=no
input-default-bindings=yes
cursor-autohide=1000

# Efficient playback: hardware decoding where safe, GPU output with fallbacks
# for machines without working OpenGL.
hwdec=auto-safe
hwdec-codecs=all
vo=gpu,xv,x11

# Streaming: generous read-ahead so network hiccups don't stall playback.
cache=yes
demuxer-max-bytes=200MiB
demuxer-max-back-bytes=50MiB
demuxer-readahead-secs=60
network-timeout=30

# Subtitles readable on any background.
sub-auto=fuzzy
sub-font-size=46
sub-border-size=2.6
sub-shadow-offset=1
sub-shadow-color='#99000000'
sub-margin-y=44
osd-font-size=36
screenshot-directory=~~desktop/
