# CloudStream theme for uosc. Colors follow the app theme (passed at launch).
timeline_style=bar
timeline_line_width=2
timeline_size=44
progress=windowed
progress_size=3
progress_line_width=20
top_bar_size=44
top_bar_controls=no
top_bar_title=yes
controls=command:arrow_back:script-message cs-back?Back,gap,<video,audio>subtitles,<has_many_audio>audio,command:dns:script-message cs-sources#user-data/cs/sources>0?Sources,command:upload_file:script-message cs-load-sub?Load subtitle file,gap,space,<video,audio>speed,gap,command:tune:script-message cs-settings?Playback settings,<user-data/cs/has-next>command:skip_next:script-message cs-next?Next episode,gap,fullscreen
controls_size=34
controls_margin=10
controls_spacing=4
volume=right
volume_size=40
speed_step=0.25
menu_item_height=40
menu_min_width=300
border_radius=10
font_scale=1.05
scale_fullscreen=1.25
pause_indicator=flash
buffered_time_threshold=60
autoload=no
languages=slang,en
opacity=timeline=0.85,controls=0,curtain=0.7,menu=0.97,submenu=0.5,title=0.95,tooltip=0.98
