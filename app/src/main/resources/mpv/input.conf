# CloudStream player keys for mpv. Bindings whose comment starts with the uosc menu marker also appear in the right-click menu.
ESC         script-message cs-back                     #! Back to CloudStream
BS          script-message cs-back
s           script-message cs-sources                  #! Sources…
L           script-message cs-load-sub                 #! Load subtitle file…
n           script-message cs-next                     #! Next episode
#           script-binding uosc/subtitles              #! Subtitles
#           script-binding uosc/audio                  #! Audio tracks
c           script-message cs-settings                 #! Playback settings…
#           script-binding stats/display-stats-toggle  #! Stats
MBTN_RIGHT  script-binding uosc/menu
MBTN_LEFT_DBL cycle fullscreen
f           cycle fullscreen
SPACE       cycle pause
LEFT        seek -10
RIGHT       seek 10
UP          add volume 5
DOWN        add volume -5
m           cycle mute
z           add sub-delay -0.1
x           add sub-delay 0.1
