<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- CloudStream for Linux: the CloudStream cloud with a play button cut through it,
       on a rounded tile. Source for the app and package icons (scripts/render-icons.js). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d6e"/>
      <stop offset="0.55" stop-color="#d4246b"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1e9ff"/>
    </linearGradient>
    <mask id="cut">
      <rect width="512" height="512" fill="black"/>
      <g fill="white">
        <circle cx="196" cy="282" r="74"/>
        <circle cx="282" cy="232" r="104"/>
        <circle cx="366" cy="290" r="66"/>
        <rect x="126" y="282" width="306" height="96" rx="48"/>
      </g>
      <!-- The play button, rounded, cut out of the cloud. -->
      <path d="M254 252 Q254 236 268 244 L326 280 Q339 288 326 296 L268 332 Q254 340 254 324 Z" fill="black"/>
    </mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2a0538" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#glow)"/>
  <!-- Three stream lines under the cloud. -->
  <g stroke="#ffffff" stroke-linecap="round" stroke-width="14" opacity="0.55">
    <line x1="176" y1="412" x2="250" y2="412"/>
    <line x1="270" y1="412" x2="300" y2="412"/>
    <line x1="320" y1="412" x2="336" y2="412"/>
  </g>
  <rect width="512" height="512" fill="url(#cloud)" mask="url(#cut)" filter="url(#shadow)"/>
</svg>
