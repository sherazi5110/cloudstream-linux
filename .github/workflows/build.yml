name: Build

on:
  push:
    branches: [main]
    tags: ["v*", "V*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch pinned upstream sources
        run: ./scripts/fetch-upstream.sh

      - name: Install players
        # libVLC for the built-in player test, mpv for the mpv IPC tests.
        run: sudo apt-get update && sudo apt-get install -y libvlc5 vlc-plugin-base mpv

      - name: Test
        # Loads real .cs3/.jar extensions, checks the Android shims, streaming sources
        # against a mock site with a dead host, the header proxy, online subtitles,
        # catalogs, libVLC playback of a protected HLS stream, and mpv IPC.
        run: ./gradlew :app:test

      - name: Build .deb and tarball
        run: |
          ./scripts/build-deb.sh
          ./gradlew :app:distTar
          mv app/build/distributions/cloudstream-linux.tar "app/build/distributions/cloudstream-linux-${GITHUB_REF_NAME//\//-}.tar"
          # The self-contained app image, for the Flatpak job (a tar keeps file permissions).
          tar -C app/build/jpackage -cf build/cloudstream-linux-app.tar cloudstream-linux

      - uses: actions/upload-artifact@v4
        with:
          name: app-image
          path: build/cloudstream-linux-app.tar
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: cloudstream-linux
          path: |
            build/*.deb
            app/build/distributions/*.tar

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.deb
            app/build/distributions/*.tar
          generate_release_notes: true

  flatpak:
    # Builds libVLC inside the Freedesktop SDK and packs the app image into a .flatpak.
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-image
          path: build

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.sherazi5110.CloudStreamLinux.yml
          bundle: cloudstream-linux.flatpak
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.yml') }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: cloudstream-linux.flatpak
