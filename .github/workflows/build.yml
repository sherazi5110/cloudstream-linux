name: Build

on:
  push:
    branches: [main]
    tags: ["v*", "V*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch pinned upstream sources
        run: ./scripts/fetch-upstream.sh

      - name: Install libVLC
        # libVLC for the player test.
        run: sudo apt-get update && sudo apt-get install -y libvlc5 vlc-plugin-base

      - name: Test
        # Loads real .cs3/.jar extensions, checks the Android shims, streaming sources
        # against a mock site with a dead host, the header proxy, online subtitles,
        # catalogs, and libVLC playback of a protected HLS stream.
        run: ./gradlew :app:test

      - name: Build .deb and tarball
        run: |
          ./scripts/build-deb.sh
          ./gradlew :app:distTar
          mv app/build/distributions/cloudstream-linux.tar "app/build/distributions/cloudstream-linux-${GITHUB_REF_NAME//\//-}.tar"
          # The self-contained app image, for the Flatpak job (a tar keeps file permissions).
          tar -C app/build/jpackage -cf build/cloudstream-linux-app.tar cloudstream-linux

      - uses: actions/upload-artifact@v4
        with:
          name: app-image
          path: build/cloudstream-linux-app.tar
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: cloudstream-linux
          path: |
            build/*.deb
            app/build/distributions/*.tar

      - name: Release notes
        # Install instructions for every file (.github/release-install.md) above GitHub's generated changes.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(ls build/*.deb | sed -E 's/.*cloudstream-linux_(.+)_amd64\.deb/\1/')
          # What's new (docs/releases/<version>.md, when there is one) goes first.
          : > build/release-notes.md
          if [ -f "docs/releases/${VERSION}.md" ]; then cat "docs/releases/${VERSION}.md" >> build/release-notes.md; echo >> build/release-notes.md; fi
          sed -e "s/{{TAG}}/${GITHUB_REF_NAME}/g" -e "s/{{VERSION}}/${VERSION}/g" .github/release-install.md >> build/release-notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.deb
            app/build/distributions/*.tar
          body_path: build/release-notes.md
          generate_release_notes: true

  android:
    # The Android app (android/, its own Gradle build): one .apk per CPU type plus a universal one.
    # After `build`, so the release (with its notes) exists before the APKs are attached.
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch pinned upstream sources
        run: ./scripts/fetch-upstream.sh

      - name: Release key
        # From repository secrets (see android/README.md); without them the APKs use a throwaway debug key.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "CS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: APKs are signed with a debug key and won't update earlier installs."
          fi

      - name: Build APKs
        working-directory: android
        env:
          CS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          VERSION_ARG=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VERSION_ARG="-PappVersion=${GITHUB_REF_NAME}"; fi
          ./gradlew assembleRelease $VERSION_ARG
          mkdir -p ../build/apk
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/app-(.+)-release\.apk/\1/')
            cp "$f" "../build/apk/cloudstream-android-$abi.apk"
          done
          ls -la ../build/apk

      - uses: actions/upload-artifact@v4
        with:
          name: cloudstream-android
          path: build/apk/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/apk/*.apk

  flatpak:
    # Builds libVLC inside the Freedesktop SDK and packs the app image into a .flatpak.
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-image
          path: build

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.sherazi5110.CloudStreamLinux.yml
          bundle: cloudstream-linux.flatpak
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.yml') }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: cloudstream-linux.flatpak
